<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palworld - Compagnon de Camp</title>

  <!-- ================================================================= -->
  <!-- 🎨 SECTION 1 : DESIGN & STYLE (CSS)                               -->
  <!-- C'est ici qu'on change les couleurs, tailles et la mise en page.  -->
  <!-- ================================================================= -->
  <style>
    * {
      box-sizing: border-box;
    }

    /* --- VARIABLES DE COULEURS DU SITE (MODE SOMBRE) --- */
    :root {
      --bg-color: #1a1e24;       /* Couleur du fond de page */
      --card-bg: #252b33;       /* Couleur de fond des cartes et blocs */
      --accent: #4f46e5;        /* Couleur violette/bleue (badges et boutons) */
      --accent-hover: #4338ca;  /* Couleur au survol */
      --text: #f3f4f6;          /* Couleur du texte principal */
      --text-muted: #9ca3af;    /* Couleur du texte secondaire */
      --border: #374151;        /* Couleur des bordures */
      --title-color: #60a5fa;   /* Couleur du titre principal */
      --gold: #eab308;          /* Couleur dorée pour les Pals Lucky */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--title-color);
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    /* --- BLOC DU MENU DÉROULANT --- */
    .controls {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid var(--accent);
    }

    /* --- CARTES DES PALS --- */
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Carte classique */
    .pal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .pal-card:hover {
      transform: translateY(-2px);
    }

    /* ✨ Style spécifique pour la carte Lucky (contour doré) */
    .pal-card.lucky-card {
      border: 3px solid var(--gold);
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
    }

    /* --- IMAGE / AVATAR DE REPLI EN COULEUR --- */
    .pal-img-container {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-weight: bold;
      font-size: 20px;
      color: #ffffff;
    }

    .pal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pal-info {
      flex-grow: 1;
    }

    .pal-name {
      font-size: 18px;
      font-weight: bold;
    }

    /* Nom doré si Lucky */
    .pal-name.lucky-text {
      color: var(--gold);
    }

    .pal-badge-desc {
      font-size: 18px;
      color: var(--text-muted);
      margin-top: 4px;
    }
	
	.mot-jaune {
          color: #ffcc00;
          font-weight: bold;
        }

    .pal-level {
      background-color: var(--accent);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 30px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!-- 🧱 SECTION 2 : STRUCTURE VISIBLE (HTML)                            -->
  <!-- C'est le squelette du site (Titre, Menu déroulant, Zone de résultat)-->
  <!-- ================================================================= -->
  <div class="container">
    
    <!-- Titre du site -->
    <h1>⛏️ Palworld - Compagnon de Camp</h1>

    <!-- Zone de sélection du métier -->
    <div class="controls">
      <label for="work-select">Sélectionne une activité de travail :</label>
      <select id="work-select" onchange="filtrerPals()">
       <option value="">-- Choisir un métier --</option>
        <option value="lumbering">Abattage (Lumbering)</option>
        <option value="kindling">Allumage de feu (Kindling)</option>
        <option value="watering">Arrosage (Watering)</option>
		<option value="handiwork">Artisanat (Handiwork)</option>
        <option value="gathering">Collecte (Gathering)</option>
		<option value="farming">Exploitation (Farming)</option>
		<option value="mining">Extraction (Mining)</option>
        <option value="electricity">Génération d'énergie (Electricity)</option>
        <option value="medicine">Pharmacie (Medicine)</option>
        <option value="cooling">Réfrigération (Cooling)</option>
        <option value="planting">Semence (Planting)</option>
        <option value="transporting">Transport (Transporting)</option>
      </select>
    </div>

    <!-- Zone où s'affichent dynamiquement les Pals -->
    <div id="results" class="results">
      <div class="empty-state">Sélectionne une activité ci-dessus pour afficher les meilleurs Pals.</div>
    </div>

  </div>

  <!-- ================================================================= -->
  <!-- ⚡ SECTION 3 : LOGIQUE ET DONNÉES (JAVASCRIPT)                   -->
  <!-- C'est ici qu'on stocke la liste des Pals et qu'on gère le tri.   -->
  <!-- ================================================================= -->
  <script>

    // -----------------------------------------------------------------
    // 📁 3.A : LA BASE DE DONNÉES DES PALS
    // Tu peux ajouter de nouveaux Pals ici en copiant une ligne !
    // N'oublie pas la virgule entre chaque ligne, SAUF sur la dernière !
    // -----------------------------------------------------------------
    const palsDatabase = [
      { id: 1, name: "Lamball", imgUrl: "images/lamball.png", color: "#252b33", isLucky: false, description: "Peut être assigné à une Exploitation avec chance de produire de la <span class=\"mot-jaune\">Laine</span>.", work: { handiwork: 1, transporting: 1, farming: 1 } },
	  { id: 2, name: "Cattiva", imgUrl: "images/cattiva.png", color: "#252b33", isLucky: false, work: { handiwork: 1, gathering: 1, mining: 1, transporting: 1} },
	  { id: 3, name: "Chikipi", imgUrl: "images/chikipi.png", color: "#252b33", isLucky: false, description: "à affecter à une Exploitation pour une chance d'optenir des <span class=\"mot-jaune\">oeufs</span>.", work: { gathering: 1, farming: 1} },
	  { id: 4, name: "Lifmunk", imgUrl: "images/lifmunk.png", color: "#252b33", isLucky: false, work: { planting: 1, handiwork: 1, gathering: 1, lumbering: 1,  medicine: 1} },
	  { id: 5, name: "Fuack", imgUrl: "images/fuack.png", color: "#252b33", isLucky: false, work: { watering: 1, handiwork: 1, transporting: 1} },
	  { id: "5B", name: "Fuack Ignis", imgUrl: "images/fuack-ignis.png", color: "#252b33", isLucky: false, work: { kindling: 2, watering: 2, handiwork: 1, transporting: 1} },
	  { id: 6, name: "Vixy", imgUrl: "images/vixy.png", color: "#252b33", isLucky: false, work: { gathering: 1, farming: 1} },
	  { id: 7, name: "Celaray", imgUrl: "images/celaray.png", color: "#252b33", isLucky: false, work: { watering: 1, transporting: 1} },
	  { id: "7B", name: "Celaray Lux", imgUrl: "images/celaray-lux.png", color: "#252b33", isLucky: false, work: { watering: 1, electricity: 2, transporting: 1} },
	  { id: 8, name: "Cremis", imgUrl: "images/cremis.png", color: "#252b33", isLucky: false, work: { gathering: 1, farming: 2} },
	  { id: 9, name: "Croajiro", imgUrl: "images/croajiro.png", color: "#252b33", isLucky: false, work: { watering: 1, handiwork: 1, gathering: 1, transporting: 1} },
	  { id: "9B", name: "Croajiro Noct", imgUrl: "images/croajiro-noct.png", color: "#252b33", isLucky: false, work: { watering: 1, handiwork: 2, gathering: 1, transporting: 1} },
	  { id: 10, name: "Herbil", imgUrl: "images/herbil.png", color: "#252b33", isLucky: false, work: { planting: 1, gathering: 1, transporting: 1} },
	  { id: 11, name: "Teafant", imgUrl: "images/teafant.png", color: "#252b33", isLucky: false, work: { watering: 1} },
	  { id: 12, name: "Gumoss", imgUrl: "images/gumoss.png", color: "#252b33", isLucky: false, work: { planting: 1} },
	  { id: 13, name: "Pupperai", imgUrl: "images/pupperai.png", color: "#252b33", isLucky: false, work: { gathering: 1, lumbering: 1, transporting: 1} },
	  { id: 14, name: "Clovee", imgUrl: "images/clovee.png", color: "#252b33", isLucky: false, description: "Lorsque le Pal est affecté à une base, augmente d'un niveau (+1) l'aptitude au travail de <span class=\"mot-jaune\">collecte</span> de tous les autres Pals de la base. (Ne se cumule pas)", work: { planting: 1, gathering: 1} },
	  
	  
	  { id: 100, name: "Anubis (Lucky ✨)", imgUrl: "images/anubis-lucky.png", color: "#252b33", isLucky: true, work: { handiwork: 6, mining: 6, transporting: 4 } },
      { id: 100, name: "Anubis", imgUrl: "images/anubis.png", color: "#252b33", isLucky: false, work: { handiwork: 6, mining: 6, transporting: 4 } },
      { id: 102, name: "Blazamut", imgUrl: "images/blazamut.png", color: "#252b33", isLucky: false, work: { kindling: 3, mining: 7 } },
      { id: 101, name: "Astegon", imgUrl: "images/astegon.png", color: "#252b33", isLucky: false, work: { mining: 7, handiwork: 3 } },
      { id: 64, name: "Digtoise", imgUrl: "images/digtoise.png", color: "#252b33", isLucky: false, work: { mining: 4 } },
      { id: 121, name: "Jormuntide", imgUrl: "images/jormuntide.png", color: "#252b33", isLucky: false, work: { watering: 7 } },
      { id: "121B", name: "Jormuntide Ignis", imgUrl: "images/jormuntide-ignis.png", color: "#252b33", isLucky: false, work: { kindling: 7 } },
      { id: 186, name: "Lyleen", imgUrl: "images/lyleen.png", color: "#252b33", isLucky: false, work: { planting: 7, handiwork: 5, medicine: 5, gathering: 6 } },
      { id: 134, name: "Wumpo", imgUrl: "images/wumpo.png", color: "#252b33", isLucky: false, work: { lumbering: 5, transporting: 6, cooling: 5 } },
      { id: 187, name: "Orserk", imgUrl: "images/orserk.png", color: "#252b33", isLucky: false, work: { electricity: 8, handiwork: 4, transporting: 4 } }
	  //{ id: 1, name: "", imgUrl: "images/.png", color: "#252b33", isLucky: false, work: { kindling: 1, watering: 1, planting: 1, electricity: 1, handiwork: 1, gathering: 1, lumbering: 1, mining: 1, medicine: 1, cooling: 1, transporting: 1, farming: 1} },//
    ];

    // -----------------------------------------------------------------
    // 🛡️ 3.B : GESTION DES IMAGES MANQUANTES
    // Si la photo n'est pas trouvée, affiche la 1ère lettre + la couleur
    // -----------------------------------------------------------------
    function imageErreur(element, palName, palColor) {
      const container = element.parentElement;
      container.style.backgroundColor = palColor || '#4f46e5';
      container.innerHTML = palName.charAt(0).toUpperCase();
    }

    // -----------------------------------------------------------------
    // ⚙️ 3.C : FONCTION DE FILTRAGE ET DE TRI
    // Déclenchée automatiquement à chaque changement dans le menu
    // -----------------------------------------------------------------
    function filtrerPals() {
      const select = document.getElementById("work-select");
      const selectedWork = select.value;
      const resultsDiv = document.getElementById("results");

      // 1. Si aucun métier n'est choisi
      if (!selectedWork) {
        resultsDiv.innerHTML = '<div class="empty-state">Sélectionne une activité ci-dessus pour afficher les meilleurs Pals.</div>';
        return;
      }

      // 2. On garde seulement les Pals ayant le métier sélectionné
      const palsFiltres = palsDatabase.filter(pal => pal.work[selectedWork] !== undefined);

      // 3. On trie : d'abord le plus haut niveau (4 -> 3 -> 2 -> 1), et si niveau égal, la version Lucky avant la normale
      palsFiltres.sort((a, b) => {
        if (b.work[selectedWork] !== a.work[selectedWork]) {
          return b.work[selectedWork] - a.work[selectedWork];
        }
        return (b.isLucky ? 1 : 0) - (a.isLucky ? 1 : 0);
      });

      // 4. Si aucun Pal ne correspond
      if (palsFiltres.length === 0) {
        resultsDiv.innerHTML = '<div class="empty-state">Aucun Pal trouvé pour cette tâche dans la base.</div>';
        return;
      }

      // 5. On génère l'affichage HTML
      resultsDiv.innerHTML = palsFiltres.map(pal => `
        <div class="pal-card ${pal.isLucky ? 'lucky-card' : ''}">
          <div class="pal-img-container" style="background-color: ${pal.color || '#374151'}">
            <img 
              src="${pal.imgUrl}" 
              alt="${pal.name}" 
              class="pal-img" 
              onerror="imageErreur(this, '${pal.name}', '${pal.color}')"
            >
          </div>
          <div class="pal-info">
            <div class="pal-name ${pal.isLucky ? 'lucky-text' : ''}">#${pal.id} - ${pal.name}</div>
            <div class="pal-badge-desc">
              ${pal.isLucky ? "Passif 'Chanceux' (+15% Vitesse)" : (pal.description || "Version classique")}
            </div>
          </div>
          <span class="pal-level">Niveau ${pal.work[selectedWork]}</span>
        </div>
      `).join('');
    }

  </script>
</body>
</html>
