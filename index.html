<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palworld - Guide des Pals et Ressources</title>

  <!-- ================================================================= -->
  <!-- 🎨 SECTION 1 : DESIGN & STYLE (CSS)                               -->
  <!-- ================================================================= -->
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #1a1e24;       
      --card-bg: #252b33;       
      --accent: #4f46e5;        
      --accent-hover: #4338ca;  
      --text: #f3f4f6;          
      --text-muted: #9ca3af;    
      --border: #374151;        
      --title-color: #60a5fa;   
      --gold: #eab308;          
      --red: #ef4444;           
      --alpha-color: #ef4444;   
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--title-color);
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu-step {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hidden {
      display: none !important;
    }

    .btn-retour {
      background-color: #374151;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      align-self: flex-start;
      margin-bottom: 5px;
      transition: background-color 0.2s;
    }

    .btn-retour:hover {
      background-color: #4b5563;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid var(--accent);
    }

    /* Grille de sélection des ressources cliquables */
    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 5px;
    }

    .resource-card-select {
      background-color: #1f2937;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .resource-card-select:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .resource-card-select img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .resource-card-select span {
      font-size: 15px;
      font-weight: bold;
      text-align: center;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .pal-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .pal-card.lucky-card {
      border: 3px solid var(--gold);
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
    }

    .pal-img-container {
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-weight: bold;
      font-size: 26px;
      color: #ffffff;
    }

    .pal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pal-info {
      flex-grow: 1;
    }

    .pal-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .pal-name.lucky-text {
      color: var(--gold);
    }

    .pal-badge-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .mot-jaune {
      color: #ffcc00;
      font-weight: bold;
    }

    .drops-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .drop-item {
      background-color: #1f2937;
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .drop-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background-color: #111827;
      border-radius: 10px;
      padding: 7px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .drop-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .drop-name {
      color: #93c5fd;
      font-weight: bold;
      font-size: 19px;
    }

    .drop-stats {
      font-size: 16px;
      color: var(--text-muted);
      display: flex;
      gap: 15px;
    }

    .drop-qty {
      color: #e5e7eb;
      font-weight: 600;
    }

    /* Styles des taux de drop */
    .rate-perfect {
      color: var(--gold);
      font-weight: bold;
    }

    .rate-low {
      color: var(--red);
      font-weight: bold;
    }

    .pal-level {
      background-color: var(--accent);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      align-self: flex-start;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 30px;
      font-style: italic;
      font-size: 16px;
    }

    /* 📱 VERSION MOBILE : Adaptation automatique sur petits écrans */
    @media (max-width: 600px) {
      .pal-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .pal-img-container {
        width: 100px;
        height: 100px;
      }

      .pal-info {
        width: 100%;
      }

      .drop-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .drop-stats {
        justify-content: center;
      }

      .pal-level {
        align-self: center;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!-- 🧱 SECTION 2 : STRUCTURE VISIBLE (HTML)                           -->
  <!-- ================================================================= -->
  <div class="container">
    
    <h1>⚔️ Palworld - Guide des Pals et Ressources</h1>

    <div class="controls">

      <!-- ÉTAPE 0 : Choix Principal -->
      <div id="step-main" class="menu-step">
        <label for="main-category">Choisis une section :</label>
        <select id="main-category" onchange="changerCategoriePrincipale()">
          <option value="">-- Choisir --</option>
          <option value="metiers">🏕️ Pals pour le Camp (Métiers)</option>
          <option value="ressources">📦 Ressources et Drops (Chasse)</option>
        </select>
      </div>

      <!-- ÉTAPE 1A : Sous-menu Métiers -->
      <div id="step-metiers" class="menu-step hidden">
        <button class="btn-retour" onclick="retourEtapeMain()">⬅️ Retour</button>
        <label for="work-select">Sélectionne un métier :</label>
        <select id="work-select" onchange="filtrerPals()">
          <option value="">-- Choisir un métier --</option>
          <option value="lumbering">Abattage (Lumbering)</option>
          <option value="kindling">Allumage de feu (Kindling)</option>
          <option value="watering">Arrosage (Watering)</option>
          <option value="handiwork">Artisanat (Handiwork)</option>
          <option value="bonus-base">✨ Bonus / Effets de base</option>
          <option value="gathering">Collecte (Gathering)</option>
          <option value="farming">Exploitation (Farming)</option>
          <option value="mining">Extraction (Mining)</option>
          <option value="electricity">Génération d'énergie (Electricity)</option>
          <option value="medicine">Pharmacie (Medicine)</option>
          <option value="cooling">Réfrigération (Cooling)</option>
          <option value="planting">Semence (Planting)</option>
          <option value="transporting">Transport (Transporting)</option>
        </select>
      </div>

      <!-- ÉTAPE 1B : Choix de la ressource -->
      <div id="step-ressources" class="menu-step hidden">
        <button class="btn-retour" onclick="retourEtapeMain()">⬅️ Retour</button>
        <label>Choisis une ressource :</label>
        <div class="resources-grid">
          <div class="resource-card-select" onclick="selectionnerRessource('Laine')">
            <img src="images/wool.png" alt="Laine">
            <span>Laine</span>
          </div>
          <div class="resource-card-select" onclick="selectionnerRessource('Cuir')">
            <img src="images/leather.png" alt="Cuir">
            <span>Cuir</span>
          </div>
          <div class="resource-card-select" onclick="selectionnerRessource('Mouton de Lamball')">
            <img src="images/lamball_mutton_.png" alt="Mouton de Lamball">
            <span>Mouton de Lamball</span>
          </div>
          <div class="resource-card-select" onclick="selectionnerRessource('Peau précieuse')">
            <img src="images/precious-pelt.png" alt="Peau précieuse">
            <span>Peau précieuse</span>
          </div>
        </div>
      </div>

      <!-- ÉTAPE 2 : Choix du type de Pal (Normal ou Alpha) -->
      <div id="step-type-pal" class="menu-step hidden">
        <button class="btn-retour" onclick="retourEtapeRessources()">⬅️ Retour</button>
        <label for="type-pal-select">Type de Pal :</label>
        <select id="type-pal-select" onchange="filtrerPals()">
          <option value="">-- Choisir le type --</option>
          <option value="normal">🟢 Pal Normal Drops</option>
          <option value="alpha">🔴 Pal Alpha Drops (Boss)</option>
        </select>
      </div>

    </div>

    <div id="results" class="results">
      <div class="empty-state">Sélectionne une option ci-dessus pour afficher les résultats.</div>
    </div>

  </div>

  <!-- ================================================================= -->
  <!-- ⚡ SECTION 3 : LOGIQUE ET DONNÉES (JAVASCRIPT)                  -->
  <!-- ================================================================= -->
  <script>
    let ressourceSelectionnee = "";

    const palsDatabase = [
      { id: 1, name: "Lamball", imgUrl: "images/lamball.png", color: "#252b33", isLucky: false, description: "Peut être assigné à une Exploitation avec chance de produire de la <span class=\"mot-jaune\">Laine</span>.", 
        work: { handiwork: 1, transporting: 1, farming: 1 }, 
        normalDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x1-3", rate: "100%" },
          { name: "Mouton de Lamball", img: "images/lamball_mutton_.png", qty: "x1", rate: "100%" }
        ], 
        alphaDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x1-3", rate: "100%" },
          { name: "Mouton de Lamball", img: "images/lamball_mutton_.png", qty: "x2", rate: "100%" }
        ] 
      },
      { id: 2, name: "Cattiva", imgUrl: "images/cattiva.png", color: "#252b33", isLucky: false, 
        work: { handiwork: 1, gathering: 1, mining: 1, transporting: 1}, 
        normalDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x20", rate: "60%" },
          { name: "Cuir", img: "images/leather.png", qty: "x10", rate: "100%" }
        ], 
        alphaDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x20", rate: "60%" },
          { name: "Cuir", img: "images/leather.png", qty: "x20", rate: "100%" }
        ] 
      },
      { id: 3, name: "Chikipi", imgUrl: "images/chikipi.png", color: "#252b33", isLucky: false, description: "à affecter à une Exploitation pour une chance d'obtenir des <span class=\"mot-jaune\">oeufs</span>.", 
        work: { gathering: 1, farming: 1}, 
        normalDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x1-2", rate: "100%" },
          { name: "Cuir", img: "images/leather.png", qty: "x1", rate: "100%" }
        ], 
        alphaDrops: [
          { name: "Laine", img: "images/wool.png", qty: "x1-2", rate: "100%" },
          { name: "Cuir", img: "images/leather.png", qty: "x2", rate: "100%" }
        ] 
      }
    ];

    function imageErreur(element, palName, palColor) {
      const container = element.parentElement;
      container.style.backgroundColor = palColor || '#4f46e5';
      container.innerHTML = palName.charAt(0).toUpperCase();
    }

    function imageDropErreur(element) {
      element.style.display = 'none'; 
    }

    function changerCategoriePrincipale() {
      const mainCat = document.getElementById("main-category").value;
      
      document.getElementById("step-main").classList.add("hidden");
      document.getElementById("results").innerHTML = '<div class="empty-state">Sélectionne une option ci-dessous.</div>';

      if (mainCat === "metiers") {
        document.getElementById("step-metiers").classList.remove("hidden");
        document.getElementById("work-select").value = "";
      } else if (mainCat === "ressources") {
        document.getElementById("step-ressources").classList.remove("hidden");
      }
    }

    function selectionnerRessource(nomRessource) {
      ressourceSelectionnee = nomRessource;

      document.getElementById("step-ressources").classList.add("hidden");
      document.getElementById("step-type-pal").classList.remove("hidden");
      document.getElementById("type-pal-select").value = "";

      document.getElementById("results").innerHTML = '<div class="empty-state">Choisis le type de Pal (Normal ou Alpha).</div>';
    }

    function retourEtapeMain() {
      document.getElementById("main-category").value = "";
      document.getElementById("work-select").value = "";
      document.getElementById("type-pal-select").value = "";
      ressourceSelectionnee = "";

      document.getElementById("step-metiers").classList.add("hidden");
      document.getElementById("step-ressources").classList.add("hidden");
      document.getElementById("step-type-pal").classList.add("hidden");
      document.getElementById("step-main").classList.remove("hidden");

      document.getElementById("results").innerHTML = '<div class="empty-state">Sélectionne une option ci-dessus pour afficher les résultats.</div>';
    }

    function retourEtapeRessources() {
      document.getElementById("type-pal-select").value = "";
      document.getElementById("step-type-pal").classList.add("hidden");
      document.getElementById("step-ressources").classList.remove("hidden");
      document.getElementById("results").innerHTML = '<div class="empty-state">Sélectionne une ressource.</div>';
    }

    function filtrerPals() {
      const mainCat = document.getElementById("main-category").value;
      const resultsDiv = document.getElementById("results");
      let palsFiltres = [];

      if (mainCat === "metiers") {
        const selectedWork = document.getElementById("work-select").value;
        if (!selectedWork) {
          resultsDiv.innerHTML = '<div class="empty-state">Sélectionne un métier.</div>';
          return;
        }

        if (selectedWork === "bonus-base") {
          palsFiltres = palsDatabase.filter(pal => pal.description && pal.description.trim() !== "");
        } else {
          palsFiltres = palsDatabase.filter(pal => pal.work && pal.work[selectedWork] !== undefined);
          palsFiltres.sort((a, b) => {
            if (b.work[selectedWork] !== a.work[selectedWork]) {
              return b.work[selectedWork] - a.work[selectedWork];
            }
            return (b.isLucky ? 1 : 0) - (a.isLucky ? 1 : 0);
          });
        }

        renderResults(palsFiltres, "metier", selectedWork);

      } else if (mainCat === "ressources") {
        const palType = document.getElementById("type-pal-select").value;

        if (!ressourceSelectionnee || !palType) {
          resultsDiv.innerHTML = '<div class="empty-state">Sélectionne le type de Pal.</div>';
          return;
        }

        if (palType === "normal") {
          palsFiltres = palsDatabase.filter(pal => pal.normalDrops && pal.normalDrops.some(d => d.name === ressourceSelectionnee));
        } else {
          palsFiltres = palsDatabase.filter(pal => pal.alphaDrops && pal.alphaDrops.some(d => d.name === ressourceSelectionnee));
        }

        palsFiltres.sort((a, b) => {
          const dropsA = (palType === "normal" ? a.normalDrops : a.alphaDrops).find(d => d.name === ressourceSelectionnee);
          const dropsB = (palType === "normal" ? b.normalDrops : b.alphaDrops).find(d => d.name === ressourceSelectionnee);

          const qtyMaxA = parseInt(dropsA.qty.split('-').pop()) || 0;
          const qtyMaxB = parseInt(dropsB.qty.split('-').pop()) || 0;
          
          if (qtyMaxA !== qtyMaxB) {
            return qtyMaxB - qtyMaxA; 
          }

          const rateA = parseInt(dropsA.rate) || 0;
          const rateB = parseInt(dropsB.rate) || 0;
          return rateB - rateA; 
        });

        renderResults(palsFiltres, "ressource", palType, ressourceSelectionnee);
      }
    }

    function renderResults(pals, mode, subParam, targetResource = "") {
      const resultsDiv = document.getElementById("results");

      if (pals.length === 0) {
        resultsDiv.innerHTML = '<div class="empty-state">Aucun Pal trouvé pour cette sélection.</div>';
        return;
      }

      resultsDiv.innerHTML = pals.map((pal, index) => {
        let badgeText = "";
        let dropsHTML = "";

        if (mode === "metier") {
          badgeText = subParam === "bonus-base" ? "Bonus / Effets" : "Niveau " + pal.work[subParam];
          let descText = pal.description ? pal.description : (pal.isLucky ? "Passif 'Chanceux' (+15% Vitesse)" : "");
          
          if (descText) {
            dropsHTML = `<div class="pal-badge-desc">${descText}</div>`;
          }
        } else {
          badgeText = subParam === "normal" ? "Normal" : "Alpha (Boss)";
          let listToDisplay = (subParam === "normal") ? pal.normalDrops : pal.alphaDrops;

          if (targetResource) {
            listToDisplay = listToDisplay.filter(drop => drop.name === targetResource);
          }

          dropsHTML = `<div class="drops-list">` + listToDisplay.map((drop, dropIndex) => {
            let rateValue = parseInt(drop.rate) || 0;
            let isFirstTopItem = (index === 0 && dropIndex === 0);
            
            let rateClass = "";
            let qtyClass = "";

            if (rateValue >= 100 || isFirstTopItem) {
              rateClass = "rate-perfect";
            } else if (rateValue < 10) {
              rateClass = "rate-low";
            }

            if (isFirstTopItem) {
              qtyClass = "rate-perfect";
            }

            return `
              <div class="drop-item" style="border-color: #60a5fa;">
                <img src="${drop.img}" alt="${drop.name}" class="drop-img" onerror="imageDropErreur(this)">
                <div class="drop-details">
                  <span class="drop-name">${drop.name}</span>
                  <div class="drop-stats">
                    <span>Quantité : <strong class="drop-qty ${qtyClass}">${drop.qty}</strong></span>
                    <span>•</span>
                    <span>Taux : <span class="${rateClass}">${drop.rate}</span></span>
                  </div>
                </div>
              </div>
            `;
          }).join('') + `</div>`;
        }

        return `
          <div class="pal-card ${pal.isLucky ? 'lucky-card' : ''}">
            <div class="pal-img-container" style="background-color: ${pal.color || '#374151'}">
              <img 
                src="${pal.imgUrl}" 
                alt="${pal.name}" 
                class="pal-img" 
                onerror="imageErreur(this, '${pal.name}', '${pal.color}')"
              >
            </div>
            <div class="pal-info">
              <div class="pal-name ${pal.isLucky ? 'lucky-text' : ''}">#${pal.id} - ${pal.name}</div>
              ${dropsHTML}
            </div>
            <span class="pal-level">${badgeText}</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
